<style>
@font-face{font-family:"VT323";src:local("VT323"),url(fonts/VT323-Regular.ttf) format("truetype")}
:root{--card:#fff6e0;--ink:#3b2412;--acc:#d9480f;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2e2216;--ink:#fbeed8;--acc:#ff922b}}
:root[data-theme="dark"]{--card:#2e2216;--ink:#fbeed8;--acc:#ff922b}
html,body{height:100%;margin:0;background:#1b1b1b;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"VT323","Courier New",monospace}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}
#ov.h{display:none}
.card{background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:0;padding:18px 20px;max-width:340px;width:100%;text-align:center;box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.card h1{margin:0 0 6px;font-size:46px;line-height:1.05;color:var(--acc)}
.card h2{margin:0 0 6px;font-size:34px;color:var(--acc)}
.card p{margin:8px 0;font-size:22px;line-height:1.4}
.card small{display:block;opacity:.75;font-size:19px;line-height:1.3}
button{font:inherit;font-weight:700;font-size:28px;border:4px solid var(--ink);border-radius:0;padding:6px 26px;box-shadow:4px 4px 0 var(--ink);margin-top:10px;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{max-height:94vh;overflow:auto}#ov{touch-action:pan-y}.sm{font-size:20px;padding:2px 12px;margin:4px;box-shadow:2px 2px 0 var(--ink)}.row{display:flex;justify-content:space-between;align-items:center;font-size:22px}button:disabled{opacity:.4;cursor:default}
#ov.b{align-items:flex-end;background:none;pointer-events:none}#ov.b .card{pointer-events:auto;padding:10px 14px;max-width:300px}
</style></head><body>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let W=0,H=0,LW=0,Z=1;
function resize(){const cw=cv.clientWidth||640,ch=cv.clientHeight||360;W=480;H=Math.max(200,Math.round(W*ch/cw));Z=Math.max(1,Math.round(1920/Math.max(W,H)));cv.width=W*Z;cv.height=H*Z;ctx.setTransform(Z,0,0,Z,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let best=+store('an_best')||0,bank=+store('an_coins')||0;

/* Âm thanh */
let AC=null;
function beep(f,d=.1,t='square',v=.05,f2){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v;g.gain.linearRampToValueAtTime(0,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* Chặng */
const BI=[
{n:'Đường làng',to:1500,sky:'#8fd3f4',gr:'#7bc043',hl:'#5ea02e',rd:'#c9a26b',deco:['tree','house','tree','wheat'],low:'chick',blk:['cart','box']},
{n:'Cánh đồng lúa',to:3500,sky:'#ffe29f',gr:'#e0bf48',hl:'#c4a233',rd:'#b98b4f',deco:['wheat','wheat','tree','wheat'],low:'rock',blk:['tract','buff']},
{n:'Chợ quê',to:5500,sky:'#ffd1a9',gr:'#b9b59c',hl:'#968f78',rd:'#a07850',deco:['tent','lantern','tent','basket'],low:'basket',blk:['box','cart']},
{n:'Sông nước',to:7500,sky:'#a0e7f5',gr:'#3f9bc4',hl:'#2f7fa6',rd:'#9b7a4b',deco:['tree','boat','wheat','tree'],low:'log',blk:['boat','box']},
{n:'Thị trấn',to:1e12,sky:'#b0b8c8',gr:'#7a7f86',hl:'#5c6168',rd:'#4a4d52',deco:['tower','sign','tower','tower'],low:'cone',blk:['moto','truck']}];
const CANDY=['candy','candy2','candy3'],FRUIT=['apple','orange','banana','melon','grape'];
const SHOUT=['An! Đứng lại đó!','Bò đâu rồi hả con!','Con đứng lại cho mẹ!','Mẹ đếm đến ba nhé!'];

let S,state='menu';
const UU=()=>Math.min(W*.12,H*.16),GYY=()=>Math.round(H*(W>H?.76:.58)),PX=()=>Math.round(W*.28),VIS=()=>(W-PX())/UU();
function mission(l){return{l,c:20+l*15,f:0,mc:0,mf:0}}
function reset(){S={dist:0,sx:0,v:4.5,gap:65,py:0,vy:0,slide:0,inv:0,ride:0,obs:[],spawnD:9,decoT:0,coins:0,candy:0,fruit:0,calm:0,cows:0,nextCow:400,cpD:700,cpN:0,cpSpN:-1,t:0,bi:0,banner:2.5,shake:0,bell:0,shout:'',shoutT:3,shoutV:0,toast:'',toastT:0,mis:mission(0),won:false,cloud:0}}
reset();
function toast(m){S.toast=m;S.toastT=2}
function items(h,d,n,kind,st,arc){for(let i=0;i<n;i++){const k='coin',e='coin';S.obs.push({t:'item',k,e,d:d+i*(st||.9),h:h+(arc?Math.sin(i/Math.max(1,n-1)*Math.PI)*arc:0)})}}
function spawn(d){if(S.cpD-S.dist<45){items(.35,d,6);return}const B=BI[S.bi],r=Math.random(),low=x=>S.obs.push({t:'low',e:Math.random()<.5?'hay':B.low,w:1.1,hh:.85,d:x}),br=x=>S.obs.push({t:'branch',d:x});
if(r<.25){low(d+1.8);items(.4,d,5,null,.9,1)}
else if(r<.4){br(d+2);items(.35,d,5)}
else if(r<.55){low(d);br(d+4.5);items(.4,d-1,3,null,.9,.9);items(.35,d+3.6,4)}

else if(r<.76)items(.35,d,7)
